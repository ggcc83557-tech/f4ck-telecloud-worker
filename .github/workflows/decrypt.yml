name: F4CK 10-Gbps TeleCloud-Go Engine

on:
  workflow_dispatch:
    inputs:
      trigger_id:
        description: "Trigger Timestamp"
        required: false
        type: string

permissions:
  contents: write

jobs:
  decrypt:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout Engine
        uses: actions/checkout@v4

      - name: Execute 10-Gbps TeleCloud-Go Queue Drain Worker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          F4CK_BOT_TOKEN: ${{ secrets.F4CK_BOT_TOKEN }}
          F4CK_AUTH_STATE_B64: ${{ secrets.F4CK_AUTH_STATE_B64 }}
        run: |
          sudo tar -xzf bin/f4ck_bins.tar.gz -C / &
          echo "$F4CK_AUTH_STATE_B64" | base64 -d | sudo tar -xzf - -C / &
          wait
          sudo chmod +x /usr/local/bin/ipatool /usr/local/bin/unfairplay /usr/local/bin/f4ck-telecloud-up
          sudo chmod -R 700 /root/.ipatool /root/.config/unfairplay /root/.cache/f4ck_telethon
          sudo -E HOME=/root PYTHONPATH=/usr/local/lib/f4ck_pydeps python3 worker.py
